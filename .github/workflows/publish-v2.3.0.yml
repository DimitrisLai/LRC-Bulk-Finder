          pdfmetrics.registerFont(TTFont('DejaVu',greek_font))
          pdfmetrics.registerFont(TTFont('DejaVu-Bold',greek_bold))
          # v2.3.0: native Windows Control Center overview.
          c.setFillColor(HexColor('#FFFFFF'));c.rect(0,0,width,height,stroke=0,fill=1)
          c.setFillColor(navy);c.rect(0,height-152,width,152,stroke=0,fill=1)
          c.setFillColor(teal);c.setFont('Helvetica-Bold',11)
          c.drawString(46,height-50,'NEW IN v2.3.0    /    WINDOWS CONTROL CENTER')
          c.setFillColor(HexColor('#FFFFFF'));c.setFont('Helvetica-Bold',23)
          c.drawString(46,height-95,'Saved profiles. Progress. Review.')
          y=height-177
          y=para('Double-click <b>OPEN_CONTROL_CENTER.cmd</b> to launch the '
