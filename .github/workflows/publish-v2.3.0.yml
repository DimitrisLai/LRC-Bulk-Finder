name: Publish LRC Bulk Finder v2.3.0 Public Beta

on:
  push:
    branches: [main]
    paths:
      - "PUBLISH_PAUSED_UNTIL_VERIFIED"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v2.3.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DimitrisLai/LRC-Bulk-Finder'
    runs-on: ubuntu-latest
    steps:
      - name: Check out versioned source
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test and manual dependencies
        run: python -m pip install --disable-pip-version-check mutagen Unidecode reportlab pypdf
      - name: Run regression tests before publishing
        run: python -m unittest discover -p 'TEST_*.py' -v
      - name: Build checked Windows ZIP and updated PDF manual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python BUILD_GREEK_LEXICON_DB.py
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from hashlib import sha256
          import sqlite3
          import subprocess
          from reportlab.pdfgen import canvas
          from reportlab.lib.colors import HexColor
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.styles import ParagraphStyle
          from reportlab.platypus import Paragraph
          from pypdf import PdfReader, PdfWriter

          version='2.3.0'
          prefix='LRC_Bulk_Finder_v2_3_0/'
          out=Path('dist')
          zip_path=out/'LRC_Bulk_Finder_Public_v2_3_0_GitHub_Release_Windows.zip'
          pdf_path=out/'LRC_Bulk_Finder_v2_3_0_Complete_User_Manual_EN.pdf'

          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          excluded=('downloads/','docs/', '.github/workflows/publish-v2.3.0.yml')
          files=[Path(x) for x in paths if x and Path(x).is_file() and
                 not x.startswith(excluded) and not x.lower().endswith(('.zip','.pdf'))]
          with ZipFile(zip_path,'w',ZIP_DEFLATED,compresslevel=8) as z:
              for path in sorted(files):
                  z.write(path,prefix+path.as_posix())
              z.write('Greek_Lexicon.sqlite3',prefix+'Greek_Lexicon.sqlite3')
          with ZipFile(zip_path) as z:
              assert z.testzip() is None
              members=set(z.namelist())
              assert len(members)==len(z.namelist())
              launchers=['OPEN_CONTROL_CENTER.cmd','START_HERE.cmd','CONNECT_EXISTING_LRCLIB_DATABASE.cmd',
                         'SETUP_LRCLIB_DATABASE.cmd','SETUP_LRCLIB_DATABASE_FROM_FILE.cmd',
                         'CLEANUP_LRCLIB_DATABASE.cmd','SETUP_GREEK_AI.cmd',
                         'Run_Diagnostics.cmd','Run_LRC_Finder.cmd','Start_LRC_Finder.bat']
              required=launchers+['LICENSE','README.md','LRC_Bulk_Finder.py',
                  'TEST_CANDIDATE_PROMOTION_V2_1_16.py',
                  'TEST_CANDIDATE_SIDECARS_V2_1_8.py','TEST_GREEK_TITLE_QUALITY_V2_1_17.py',
                  'TEST_GREEK_LEXICON_SQLITE_V2_1_18.py','TEST_GREEK_ARTIST_QUALITY_V2_1_19.py','TEST_OFFLINE_FIRST_PIPELINE_V2_1_20.py',
                  'TEST_STABILITY_V2_1_21.py','search_checkpoint.py',
                  'TEST_SEARCH_PERFORMANCE_V2_2.py','search_performance.py',
                  'TEST_USER_EXPERIENCE_V2_3.py','search_profiles.py',
                  'run_saved_profile.py','progress_eta.py','review_candidates_gui.py',
                  'LRC_Control_Center.py','runtime_paths.py','OPEN_CONTROL_CENTER.cmd',
                  'BUILD_GREEK_LEXICON_DB.py',
                  'Greek_Words.csv','Greek_Words_Expanded.csv','Greek_Artists.csv',
                  'Greek_Lexicon.sqlite3','g2g_integration.py','CONTRIBUTING.md','SECURITY.md',
                  'HOW_TO_START_V2_2.txt','RELEASE_NOTES_V2_2.md','TEST_AUDIT_V2_2.md']
              assert all(prefix+p in members for p in required)
              source=z.read(prefix+'LRC_Bulk_Finder.py')
              assert b"VERSION = '2.3.0'" in source
              # Confirm this is a launch-ready Windows package, not a code-only ZIP.
              assert b'call "%~dp0Run_LRC_Finder.cmd"' in z.read(prefix+'START_HERE.cmd')
              assert b'LRC_Bulk_Finder.py' in z.read(prefix+'Run_LRC_Finder.cmd')
              assert b'START_HERE.cmd' in z.read(prefix+'Start_LRC_Finder.bat')
              assert b'[00:00.00] candidate' in source
              assert b'def _shift_promotion_alternatives' in source
              assert b'patch_known_greek_words' in source
              assert b'def safe_to_convert_artist' in source
              assert b'approved_artist_alias' in source
              assert b'SKIP_UNVERIFIED_ARTIST_G2G' in source
              assert b'offline_stage=staged_mode and rnd==1' in source
              assert b'checkpoint.save(path,rnd,status,detail,new_retry' in source
              assert b'query_variants(title,artist)[:6]' in source
              assert b'MusicBrainzDiskCache(folder)' in source
              assert b'choose_provider_order(' in source
              assert b'provider_performance.record_rows(' in source
              assert b'checkpoint.run_id' in source
              assert b'RoundProgress(len(current),rnd,phase)' in source
              assert b'from runtime_paths import program_folder' in source
              assert b'OPEN_CONTROL_CENTER.cmd' in z.read(prefix+'README_FIRST.txt')
              with sqlite3.connect('Greek_Lexicon.sqlite3') as db:
                  db_count=db.execute('SELECT COUNT(*) FROM words').fetchone()[0]
                  assert db_count>=1000, f'Unexpectedly small Greek lexicon: {db_count}'
                  assert db.execute('PRAGMA application_id').fetchone()[0]==0x4C524347
                  assert db.execute('PRAGMA quick_check').fetchone()[0]=='ok'
              assert 'Copyright (c) 2026 Dimitris L.' in z.read(prefix+'LICENSE').decode()
              assert not any('lrclib-db-dump-' in m or 'LRCLIB_LOCAL_DB.txt' in m
                             for m in members)
              print('PASS ZIP: v2.3.0 Windows GUI/CLI launchers, profile safety, ETA, candidates, original provider guarantees')

          navy=HexColor('#10223E'); teal=HexColor('#19BFCA')
          dark=HexColor('#25364B'); subtle=HexColor('#57677C')
          pale=HexColor('#E9F7F8'); cloud=HexColor('#F2F5FA')
          width,height=A4
          buf=BytesIO()
          c=canvas.Canvas(buf,pagesize=A4)
          c.setTitle('LRC Bulk Finder v2.3.0 - Complete User Manual')
          def para(text,x,y,w,size=10.5,leading=15,color=dark,bold=False):
              font='Helvetica-Bold' if bold else 'Helvetica'
              style=ParagraphStyle('custom',fontName=font,fontSize=size,
                                   leading=leading,textColor=color)
              p=Paragraph(text,style)
              _,h=p.wrap(w,1000)
              p.drawOn(c,x,y-h)
              return y-h
          def pill(text,x,y,w):
              c.setFillColor(teal);c.roundRect(x,y,w,27,13.5,stroke=0,fill=1)
              c.setFillColor(navy);c.setFont('Helvetica-Bold',10)
              c.drawCentredString(x+w/2,y+9,text)

          # Full-bleed publication-quality update cover
          c.setFillColor(navy);c.rect(0,0,width,height,stroke=0,fill=1)
          c.setFillColor(HexColor('#173A56'))
          c.circle(550,675,205,stroke=0,fill=1)
          c.setStrokeColor(teal);c.setLineWidth(3)
          c.circle(550,675,140,stroke=1,fill=0)
          c.setFillColor(teal);c.rect(52,height-80,36,4,stroke=0,fill=1)
          c.setFont('Helvetica-Bold',12);c.drawString(99,height-82,'USER GUIDE  /  WINDOWS EDITION')
          c.setFillColor(HexColor('#FFFFFF'))
          c.setFont('Helvetica-Bold',47);c.drawString(52,590,'LRC BULK')
          c.drawString(52,530,'FINDER')
          c.setFillColor(teal);c.setFont('Helvetica-Bold',25)
          c.drawString(52,473,'v2.3.0')
          c.setFillColor(HexColor('#D8E7F0'));c.setFont('Helvetica',15)
          c.drawString(52,414,'NEW WINDOWS CONTROL CENTER')
          c.drawString(52,389,'SAVED SEARCH PROFILES AND ETA')
          c.setStrokeColor(HexColor('#3B5A77'));c.setLineWidth(1)
          c.line(52,346,540,346)
          c.setFillColor(HexColor('#EAF6F9'));c.setFont('Helvetica-Bold',12)
          c.drawString(52,309,'NEW IN THIS EDITION')
          c.setFont('Helvetica',12)
          c.drawString(52,279,'Save settings and one-click repeat searches')
          c.drawString(52,253,'Live progress and honest per-round ETA')
          c.drawString(52,227,'Review unverified candidates explicitly')
          pill('PUBLIC BETA',52,138,132)
          c.setFillColor(HexColor('#C4D2E3'));c.setFont('Helvetica',10)
          c.drawString(52,89,'Created by Dimitris L.  |  October 2026')
          c.drawString(52,68,'Update pages first; earlier v2.1.15 core guide follows as reference.')
          c.showPage()

          # v2.3.0 language quality overview; DejaVu supports accented Greek.
          from reportlab.pdfbase import pdfmetrics
          from reportlab.pdfbase.ttfonts import TTFont
          greek_font='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
