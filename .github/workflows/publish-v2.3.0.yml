      - name: Publish v2.3.0 as a separate prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v2.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v2.3.0 dist/*.zip dist/*.pdf --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v2.3.0 dist/*.zip dist/*.pdf \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "LRC Bulk Finder v2.3.0 - Windows Control Center" \
              --notes-file RELEASE_NOTES_V2_2.md --prerelease
          fi
      - name: Download assets back and verify identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded
          gh release download v2.3.0 --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" --pattern "*.pdf" --dir downloaded
          for file in dist/*; do cmp "$file" "downloaded/$(basename "$file")"; done
          unzip -t dist/*.zip >/dev/null
          echo "PASS: Publicly published ZIP and PDF match the tested local assets"
      - name: Save same Windows ZIP in repository downloads
        run: |
          set -euo pipefail
          cp dist/*.zip downloads/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloads/LRC_Bulk_Finder_Public_v2_3_0_GitHub_Release_Windows.zip
          git commit -m "chore(downloads): add verified v2.3.0 Windows offline backup"
          git push
