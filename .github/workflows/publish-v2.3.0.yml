          c.setFillColor(subtle);c.setFont('Helvetica',8.2)
          c.drawString(46,53,'Full settings and cache files: HOW_TO_START_V2_2.txt')
          c.drawString(46,37,'All original MP3s, existing LRCs and candidate review protections remain.')
