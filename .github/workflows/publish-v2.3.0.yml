          c.setFillColor(subtle);c.setFont('Helvetica',8.5)
          c.drawString(46,57,'New setup: OPEN_CONTROL_CENTER.cmd. Old console: START_HERE.cmd.')
          c.drawString(46,40,'Detailed profile options: HOW_TO_START_V2_3.txt in the Windows ZIP.')
          c.showPage()

          # v2.3.0: all-options and safety reference for GUI search/review.
          c.setFillColor(HexColor('#FFFFFF'));c.rect(0,0,width,height,stroke=0,fill=1)
          c.setFillColor(navy);c.rect(0,height-145,width,145,stroke=0,fill=1)
          c.setFillColor(teal);c.setFont('Helvetica-Bold',11)
          c.drawString(46,height-48,'v2.3.0    /    DAILY WORKFLOW')
          c.setFillColor(HexColor('#FFFFFF'));c.setFont('Helvetica-Bold',23)
          c.drawString(46,height-92,'From a music folder to reviewed LRCs')
          y=height-169
          for i,(label,body) in enumerate([
              ('01  CREATE OR LOAD A PROFILE',
               'Choose a descriptive name, folder and mode: 5 OFFLINE FIRST '
               '(recommended), 1 NORMAL or 4 OFFLINE ONLY. Choose settings '
               'and save. Local AI requires its separately installed model.'),
              ('02  SELECT TEST OR FULL LIBRARY',
               'Use 20 for a quick controlled run or A for your entire '
               'collection. A saved profile answers only recognized CLI '
               'questions; unexpected prompts stop safely.'),
              ('03  WATCH A ROUND-SPECIFIC ETA',
               'Stage progress counts checkpoint-reused songs as completed, '
               'but excludes them from the timing average. Choose Stop to '
               'request graceful interruption; finished JSONL stages persist.'),
              ('04  REVIEW UNCERTAIN RESULTS',
               'Inspect the LRC text and listen via your usual audio player. '
               'A candidate is not proof of correct singer, recording version '
               'or timing; do not confuse it with a verified match.'),
              ('05  OPTIONAL MARKED PROMOTION',
               'Select a primary .candidate.lrc and confirm EACH install. '
               'The resulting .lrc visibly includes [00:00.00] candidate. '
               'Existing LRCs are never overwritten; MP3/ID3 remains intact.')
          ],1):
              c.setFillColor(cloud if i%2 else pale)
              c.roundRect(46,y-88,503,94,8,stroke=0,fill=1)
              c.setFillColor(navy);c.setFont('Helvetica-Bold',10.6)
              c.drawString(60,y-16,label)
              para(body,60,y-27,470,8.9,13.6)
              y-=104
          c.setFillColor(subtle);c.setFont('Helvetica',8.6)
          c.drawString(46,70,'Numbered candidate alternatives stay read-only until they become primary.')
          c.drawString(46,51,'For exact 13 CLI prompts, see HOW_TO_START_V2_3.txt.')
          c.drawString(46,34,'Safety: NO automatic candidate approval. NO original MP3 modifications.')
          c.showPage()

          # NEW v2.3.0: one visually distinct search performance page.
          c.setFillColor(HexColor('#FFFFFF'));c.rect(0,0,width,height,stroke=0,fill=1)
          c.setFillColor(navy);c.rect(0,height-151,width,151,stroke=0,fill=1)
          c.setFillColor(teal);c.setFont('Helvetica-Bold',11)
          c.drawString(46,height-47,'NEW IN v2.3.0   /   SEARCH PERFORMANCE')
          c.setFillColor(HexColor('#FFFFFF'));c.setFont('Helvetica-Bold',24)
          c.drawString(46,height-97,'Smarter searches. Less repeated work.')
          y=height-170
          y=para('The verified-only matching safeguards remain unchanged. '
                 'Version 2.2 improves which provider is searched first, '
                 'reduces repeated MusicBrainz requests, measures actual '
                 'saves and protects interrupted search progress.',
                 46,y,500,10.5,16)-25
          steps=[
              ('01','PERSISTENT MUSICBRAINZ CACHE',
               'Successful title/artist suggestions last 30 days; completed '
               'NO_MATCH lasts 7 days. Duration and Greek mode are part of '
               'the key; HTTP errors never poison the cache.'),
              ('02','PROVIDER ORDER: D / S / C',
