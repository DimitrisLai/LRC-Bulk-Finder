name: Publish LRC Bulk Finder v2.1.15 Public Beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v2.1.15.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-v2.1.15
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'DimitrisLai/LRC-Bulk-Finder'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Create license-complete ZIP and validate it
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import tempfile
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          archive = Path("downloads/LRC_Bulk_Finder_Public_v2_1_15_GitHub_Release_Windows.zip")
          prefix = "LRC_Bulk_Finder_v2_1_15/"
          docs = ["LICENSE", "CREATOR_AND_ATTRIBUTION.txt",
                  "PUBLICATION_AND_LICENSE_NOTES.txt", "README.md"]
          assert archive.is_file(), "Windows release ZIP missing"
          assert "MIT License" in Path("LICENSE").read_text(encoding="utf-8")
          for doc in docs:
              assert Path(doc).is_file(), f"Missing project document: {doc}"

          fd, temp_path = tempfile.mkstemp(suffix=".zip", dir=archive.parent)
          os.close(fd)
          try:
              with ZipFile(archive) as original, ZipFile(temp_path, "w") as updated:
                  assert original.testzip() is None, "Original release ZIP is corrupted"
                  entries = set(original.namelist())
                  assert prefix + "START_HERE.cmd" in entries
                  assert prefix + "LRC_Bulk_Finder.py" in entries
                  replace = {prefix + doc for doc in docs}
                  for entry in original.infolist():
                      if entry.filename not in replace:
                          updated.writestr(entry, original.read(entry.filename))
                  for doc in docs:
                      updated.write(doc, prefix + doc, compress_type=ZIP_DEFLATED)

              with ZipFile(temp_path) as verified:
                  assert verified.testzip() is None, "New ZIP is corrupted"
                  assert len(verified.namelist()) == len(set(verified.namelist()))
                  for doc in docs:
                      assert verified.read(prefix + doc) == Path(doc).read_bytes()
                  print("PASS: Verified MIT LICENSE, creator credit, third-party notes, README.")
              os.replace(temp_path, archive)
          finally:
              if os.path.exists(temp_path):
                  os.unlink(temp_path)
          PY
          test -s docs/LRC_Bulk_Finder_v2_1_15_Complete_User_Manual_EN.pdf

      - name: Replace existing GitHub release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          asset="downloads/LRC_Bulk_Finder_Public_v2_1_15_GitHub_Release_Windows.zip"
          for attempt in 1 2 3; do
            if gh release upload "v2.1.15" "$asset" --repo "$GITHUB_REPOSITORY" --clobber; then
              echo "Release archive uploaded."
              exit 0
            fi
            echo "Upload attempt $attempt failed; retrying shortly..."
            sleep 5
          done
          echo "ERROR: Cannot replace release asset. Check GitHub Actions permissions." >&2
          exit 1

      - name: Download and verify published ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          name="LRC_Bulk_Finder_Public_v2_1_15_GitHub_Release_Windows.zip"
          mkdir -p downloaded
          gh release download v2.1.15 --repo "$GITHUB_REPOSITORY" \
            --pattern "$name" --dir downloaded
          cmp "downloads/$name" "downloaded/$name"
          unzip -t "downloaded/$name" >/dev/null
          unzip -p "downloaded/$name" "LRC_Bulk_Finder_v2_1_15/LICENSE" \
            | grep -F "Copyright (c) 2026 Dimitris L."
          echo "PASS: Published ZIP matches generated ZIP and includes MIT credit."
