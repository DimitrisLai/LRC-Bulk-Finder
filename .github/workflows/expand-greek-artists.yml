name: Expand reviewed Greek artist aliases from Wikipedia
on:
  push:
    branches: [feature/wikipedia-greek-artists-expansion]
    paths:
      - 'UPDATE_GREEK_ARTISTS_WIKIPEDIA.py'
      - 'TEST_WIKIPEDIA_GREEK_ARTISTS.py'
      - '.github/workflows/expand-greek-artists.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test pagination and alias conflict safety
        run: python -m unittest TEST_WIKIPEDIA_GREEK_ARTISTS.py -v
      - name: Fetch every Wikipedia category continuation page
        run: python UPDATE_GREEK_ARTISTS_WIKIPEDIA.py
      - name: Validate expanded CSV and historical regression tests
        run: |
          python -m pip install mutagen Unidecode
          python -m unittest TEST_WIKIPEDIA_GREEK_ARTISTS.py TEST_GREEK_ARTIST_QUALITY_V2_1_19.py -v
      - name: Commit generated public CSV data to feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Greek_Artists.csv Greek_Artists_Wikipedia_Audit.csv
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No data changes"; exit 0
          fi
          git commit -m "data: add verified Greek singer aliases, preserving all existing mappings"
          git push origin HEAD:feature/wikipedia-greek-artists-expansion
