name: Python tests

on:
  push:
    branches: [main]
    paths:
      - "**/*.py"
      - ".github/workflows/tests.yml"
      - "Greek_Aliases.csv"
      - "Greek_Words.csv"
      - "Greek_Words_Expanded.csv"
      - "Greek_Artists.csv"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies for offline tests
        run: python -m pip install mutagen Unidecode
      - name: Run offline safety and feature tests
        run: python -m unittest discover -p 'TEST_*.py' -v
