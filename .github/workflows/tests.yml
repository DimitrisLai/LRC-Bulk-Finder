name: Python tests

on:
  push:
    branches: [main, 'trial/v2.2.0-test-drive']
    paths:
      - "**/*.py"
      - ".github/workflows/tests.yml"
      - "Greek_Aliases.csv"
      - "Greek_Words.csv"
      - "Greek_Words_Expanded.csv"
      - "Greek_Artists.csv"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies for offline tests
        run: python -m pip install mutagen Unidecode
      - name: Run offline safety and feature tests
        run: python -m unittest discover -p 'TEST_*.py' -v
      - name: Download the PUBLISHED v2.2.0 Windows release ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p trial_release_files
          gh release download v2.2.0 --repo DimitrisLai/LRC-Bulk-Finder --pattern '*.zip' --dir trial_release_files
      - name: Verify published ZIP checksum, extract and compile program
        shell: bash
        run: |
          python - <<'PY'
          import hashlib,zipfile,compileall
          from pathlib import Path
          z=Path('trial_release_files/LRC_Bulk_Finder_Public_v2_2_0_GitHub_Release_Windows.zip')
          digest=hashlib.sha256(z.read_bytes()).hexdigest()
          expected='65516081d8863bd910724e67827fcf526826d545fd34f051634b8dd5ca102749'
          assert digest==expected,(digest,expected)
          with zipfile.ZipFile(z) as arc:
              assert arc.testzip() is None
              names=arc.namelist()
              assert len(names)==len(set(names))
              assert all('..' not in Path(name).parts for name in names)
              arc.extractall('trial_release_files/unpacked')
          root=Path('trial_release_files/unpacked/LRC_Bulk_Finder_v2_2_0')
          for name in ('START_HERE.cmd','Run_LRC_Finder.cmd','Start_LRC_Finder.bat',
                       'CONNECT_EXISTING_LRCLIB_DATABASE.cmd','LRC_Bulk_Finder.py',
                       'search_checkpoint.py','search_performance.py',
                       'Greek_Artists.csv','Greek_Lexicon.sqlite3'):
              assert (root/name).is_file(),name
          assert compileall.compile_dir(str(root),quiet=1)
          print('PASS: exact published ZIP SHA256, no bad ZIP members, all launchers and Python compilation')
          PY
      - name: Run independent runtime trial from EXTRACTED RELEASE
        shell: bash
        run: python -m unittest -v Trial_Drive_V22
      - name: Optional single live LRCLIB availability probe (non-blocking)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request,json
          u='https://lrclib.net/api/search?track_name=Blinding%20Lights&artist_name=The%20Weeknd'
          req=urllib.request.Request(u,headers={'User-Agent':'LRCBulkFinder-Trial/2.2; automated-single-probe','Accept':'application/json'})
          try:
              with urllib.request.urlopen(req,timeout=12) as stream:
                  content=stream.read(8192)
                  print('LIVE LRCLIB STATUS:',stream.status,'JSON start:',content[:90])
          except Exception as e:print('LIVE LRCLIB UNAVAILABLE (NOT A CODE FAILURE):',type(e).__name__,str(e)[:180])
          PY
