name: QA - every GUI option, all menu modes and safe Windows launcher probes
on:
  push:
    branches: [qa/v243-full-option-audit]
    paths:
      - 'QA_EXTRA_GUI.py'
      - 'QA_WINDOWS_CMD_PROBES.py'
      - '.github/workflows/qa-v243-all-options.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    name: ${{ matrix.os }} - Python 3.13
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install core application dependencies
        run: python -m pip install --disable-pip-version-check mutagen Unidecode syncedlyrics
      - name: Re-run full published regression suite
        run: python -m unittest discover -p 'TEST_*.py' -v
      - name: Additional 23 real GUI and adversarial option checks (Windows)
        if: runner.os == 'Windows'
        run: python QA_EXTRA_GUI.py
      - name: Additional 23 GUI and adversarial checks via virtual desktop (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python QA_EXTRA_GUI.py
      - name: Actually execute Windows command launchers against safe disposable stubs
        if: runner.os == 'Windows'
        run: python QA_WINDOWS_CMD_PROBES.py
