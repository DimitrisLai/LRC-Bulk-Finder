name: v2.4.2 Instant STOP QA

on:
  push:
    branches: ["fix/v2.4.2-instant-stop"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10","3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Python dependencies
        run: python -m pip install mutagen Unidecode
      - name: Python compilation
        run: python -m compileall -q .
      - name: Entire legacy regression + new real worker hard-stop/UI tests
        run: python -m unittest discover -p 'TEST_*.py' -v
